name: qoffa
description: "Qoffa · قفة — Algerian Grocery Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^6.0.4
  archive: ^4.0.2
  decimal: ^3.0.2
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Hero Sandwich Pro
      fonts:
        - asset: assets/fonts/HeroSandwichPro-Variable.ttf
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-VariableFont_wght.ttf
